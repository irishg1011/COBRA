<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CobraByte - Coding Sandbox</title>
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="../static/animations.css">
    <link rel="stylesheet" href="../learner/css/sandbox.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../learner/css/profile-menu.css">
</head>
<body data-auth-guard-mode="refresh">

    <!-- Logged In Header -->
    <header>
        <div class="logo-container">
            <img src="../assets/images/Logo.png" alt="CobraByte Logo" class="logo-img">
        </div>

        <!-- Center Navigation -->
        <nav class="dashboard-nav">
            <a href="/dashboard" class="dashboard-nav-link">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                </svg>
                Dashboard
            </a>
            <a href="/learning-map" class="dashboard-nav-link">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
                </svg>
                Lessons
            </a>
            <a href="/sandbox" class="dashboard-nav-link active">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
                Sandbox
            </a>
        </nav>

        <!-- Right side header control panel elements -->
        <div class="header-controls">
            <button type="button" class="icon-btn header-icon-btn" aria-label="Notifications">
                <i class="fa-solid fa-bell" aria-hidden="true"></i>
            </button>

            <!-- Profile dropdown (View Profile via name, Edit Profile, Change Password, Logout) - built by learner.js -->
            <div class="profile-menu" data-profile-menu></div>
        </div>
    </header>

    <!-- Sandbox Main Content -->
    <main class="sandbox-container">

        <div class="sandbox-heading-row">
            <div class="sandbox-heading-left">
                <div class="sandbox-icon-badge">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="#ffffff">
                        <polyline points="8 9 4 12 8 15"></polyline>
                        <line x1="10" y1="18" x2="14" y2="6"></line>
                    </svg>
                </div>
                <div>
                    <h1>Coding Sandbox</h1>
                    <p>Write, run, and experiment with Python right in your browser.</p>
                </div>
            </div>

            <div class="sandbox-actions">
                <button id="saveCodeBtn" class="btn-sandbox btn-sandbox-outline">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
                    </svg>
                    Save Code
                </button>
                <button id="resetCodeBtn" class="btn-sandbox btn-sandbox-outline">
                    Reset
                </button>
                <button id="runCodeBtn" class="btn-sandbox btn-sandbox-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    Run Code
                </button>
            </div>
        </div>

        <div class="sandbox-grid">

            <!-- Code Editor Panel -->
            <div class="code-panel">
                <div class="panel-header">
                    <div class="traffic-lights">
                        <span class="dot dot-green"></span>
                        <span class="dot dot-teal"></span>
                        <span class="dot dot-blue"></span>
                    </div>
                    <span class="panel-filename">main.py</span>
                    <span class="panel-meta" id="lineCountLabel">1 line</span>
                </div>
                <textarea id="codeEditor" class="code-editor" spellcheck="false" placeholder="Input your code here"></textarea>
            </div>

            <!-- Console / Output Panel -->
            <div class="output-panel">
                <div class="panel-header">
                    <span class="panel-title">CONSOLE / OUTPUT</span>
                    <button id="clearOutputBtn" class="btn-clear">Clear</button>
                </div>
                <div class="output-body" id="outputBody">
                    <p class="output-placeholder" id="outputPlaceholder">Click "Run Code" to see your program's output here.</p>
                </div>
            </div>

        </div>

        <!-- Saved Snippets -->
        <div class="snippets-card">
            <div class="snippets-header">
                <h2>Your Saved Snippets</h2>
                <div class="snippets-header-actions">
                    <span class="snippets-count" id="snippetsCount">0 saved</span>
                    <button type="button" class="snippets-see-all-btn" id="snippetsSeeAllBtn">See All</button>
                </div>
            </div>
            <input type="text" class="snippets-search-input" id="snippetsSearchInput" placeholder="Search snippets by name..." style="display: none;">
            <p class="snippets-empty" id="snippetsEmpty">No saved snippets yet. Write some code and click "Save Code".</p>
            <ul class="snippets-list" id="snippetsList"></ul>
        </div>

    </main>



    <!-- External Script References -->
    <!-- Pyodide - real Python compiled to WebAssembly, runs entirely in
         the browser. Same runtime/version already used by the Manage
         Learning Resources lesson editor's Interactive Exercise blocks
         (see editor-toolbar.js) - loaded lazily by sandbox.js the first
         time Run Code is actually clicked, not on page load. -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
    <script src="../learner/js/sandbox.js"></script>
    <script src="../learner/js/learner.js"></script>
    <script src="../static/auth-guard.js"></script>
    <script src="../static/page-transitions.js"></script>
</body>
</html>
