<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CobraByte - Learning Map</title>
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="../static/animations.css">
    <link rel="stylesheet" href="../learner/css/learning-map.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../learner/css/profile-menu.css">
    <link rel="stylesheet" href="../learner/css/learner-responsive.css">
</head>
<body data-auth-guard-mode="refresh">

    <!-- Logged In Header -->
    <header class="learner-header">
        <div class="logo-container">
            <img src="../assets/images/logo-ad.png" alt="CobraByte Logo" class="logo-img">
        </div>

        <!-- Center Navigation -->
        <nav class="dashboard-nav">
            <a href="/dashboard" class="dashboard-nav-link">
                <i class="fa-solid fa-table-cells-large" aria-hidden="true"></i>
                Dashboard
            </a>
            <a href="/learning-map" class="dashboard-nav-link active">
                <i class="fa-solid fa-book-open" aria-hidden="true"></i>
                Lessons
            </a>
            <a href="/sandbox" class="dashboard-nav-link">
                <i class="fa-solid fa-code" aria-hidden="true"></i>
                Sandbox
            </a>
        </nav>

        <!-- Right side header control panel elements -->
        <div class="header-controls">
            <button type="button" class="icon-btn header-icon-btn" aria-label="Notifications">
                <i class="fa-solid fa-bell" aria-hidden="true"></i>
            </button>

            <!-- Profile dropdown (View Profile via name, Edit Profile, Change Password, Logout) - built by learner.js -->
            <div class="profile-menu" data-profile-menu></div>
        </div>
    </header>

    <!-- Learning Map Main Content -->
    <main class="map-page">
        <div class="map-title-row">
            <div>
                <h1>Learning Map</h1>
                <p>Python Programming for Beginners</p>
            </div>
        </div>

        <div class="map-canvas" id="mapCanvas">
            <div class="map-clouds" aria-hidden="true">
                <div class="map-cloud" style="top: 8%; left: -15%; width: 140px; height: 50px; animation-duration: 42s;"></div>
                <div class="map-cloud" style="top: 18%; left: -25%; width: 100px; height: 38px; animation-duration: 55s; animation-delay: -15s;"></div>
                <div class="map-cloud" style="top: 4%; left: -10%; width: 170px; height: 60px; animation-duration: 60s; animation-delay: -30s;"></div>
            </div>
            <div class="map-shimmer" aria-hidden="true"></div>
            <p class="map-loading" id="mapLoading">Loading your learning map...</p>
            <p class="map-error" id="mapError" style="display: none;">Could not load your learning map. Please refresh the page.</p>
            <div class="map-chain" id="mapChain"></div>
        </div>
    </main>



    <!-- External Script References -->
    <script src="../learner/js/learning-map.js"></script>
    <script src="../learner/js/learner.js"></script>
    <script src="../static/auth-guard.js"></script>
    <script src="../static/page-transitions.js"></script>
</body>
</html>
