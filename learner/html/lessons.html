<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CobraByte - Lessons</title>
    <link rel="stylesheet" href="../static/style.css">
    <link rel="stylesheet" href="../static/animations.css">
    <link rel="stylesheet" href="../learner/css/lessons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../learner/css/profile-menu.css">
</head>
<body>

    <!-- Logged In Header -->
    <header>
        <div class="logo-container">
            <img src="../assets/images/logo-ad.png" alt="CobraByte Logo" class="logo-img">
        </div>

        <nav class="dashboard-nav">
            <a href="/dashboard" class="dashboard-nav-link">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                    <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                    <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                    <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                </svg>
                Dashboard
            </a>
            <a href="/learning-map" class="dashboard-nav-link active">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
                </svg>
                Lessons
            </a>
            <a href="/sandbox" class="dashboard-nav-link">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                </svg>
                Sandbox
            </a>
        </nav>

        <div class="header-controls">
            <button type="button" class="icon-btn header-icon-btn" aria-label="Notifications">
                <i class="fa-solid fa-bell" aria-hidden="true"></i>
            </button>

            <!-- Profile dropdown (View Profile via name, Edit Profile, Change Password, Logout) - built by learner.js -->
            <div class="profile-menu" data-profile-menu></div>
        </div>
    </header>

    <main class="lessons-page">
        <a href="/learning-map" class="lessons-back-link">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
            Back
        </a>

        <div class="lessons-card">
            <div class="lessons-header-row">
                <div>
                    <h1 id="lessonsTitle">Lessons</h1>
                    <p id="lessonsSubtitle">Loading...</p>
                </div>
            </div>

            <div class="lessons-progress-box">
                <div class="lessons-progress-label-row">
                    <span>Overall Course Progress</span>
                    <span id="overallPercent">0%</span>
                </div>
                <div class="lessons-progress-track">
                    <div class="lessons-progress-fill" id="overallProgressFill" style="width: 0%;"></div>
                </div>
            </div>
        </div>

        <div class="lessons-card">
            <div class="lessons-jump-row" id="lessonsJumpRow"></div>

            <p class="lessons-loading" id="lessonsLoading">Loading lessons...</p>
            <p class="lessons-error" id="lessonsError" style="display: none;">Could not load lessons. Please refresh the page.</p>

            <div id="modulesContainer"></div>
        </div>
    </main>



    <script src="../learner/js/lessons.js"></script>
    <script src="../learner/js/learner.js"></script>
    <script src="../static/auth-guard.js"></script>
    <script src="../static/page-transitions.js"></script>
</body>
</html>
