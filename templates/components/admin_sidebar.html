<!--
    admin_sidebar.html
    -------------------
    Reusable sidebar navigation for every Admin page. Include with:

        {% include "components/admin_sidebar.html" %}

    Highlighting: pass an `active_page` variable into render_template()
    (see server/admin_dashboard.py) that matches one of the data-page
    values below, e.g. active_page="dashboard" or
    active_page="account-security". sidebar.js also re-applies the
    highlight on click for pages that don't exist yet, so the UI still
    feels alive before those routes are built.
-->
