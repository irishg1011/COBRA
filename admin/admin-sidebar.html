<!--
    Task #14: Custom Logout Confirmation Modal
    -------------------------------------------
    Reuses the exact design/markup already used by the Learner Dashboard's
    logout modal (see templates/dashboard.html: #logoutModal) so both
    modules share one consistent look. Lives here (in the shared sidebar
    partial) so every admin page that includes the sidebar gets it for
    free, with no duplicated HTML across Dashboard / Account & Security /
    future pages. Hidden by default; admin-auth-guard.js toggles it and
    wires up Cancel / Yes, Logout - no window.confirm() involved anywhere.
-->
<div id="adminLogoutModal" class="modal-overlay modal-hidden">
    <div class="modal-card modal-card-confirm">
        <div class="modal-confirm-icon modal-confirm-icon-danger">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="modal-confirm-icon-svg">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
            </svg>
        </div>
        <h3 class="modal-confirm-title">Are you sure you want to log out?</h3>
        <p class="modal-confirm-text">You will need to sign back in to access your dashboard.</p>
        <div class="modal-confirm-actions">
            <button id="adminCancelLogoutBtn" class="modal-btn-cancel">Cancel</button>
            <button id="adminConfirmLogoutBtn" class="modal-btn-danger">Yes, Logout</button>
        </div>
    </div>
</div>
