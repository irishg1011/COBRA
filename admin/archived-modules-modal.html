<!-- admin/archived-modules-modal.html
     Task #27 & #87: Unified Archives Modal - lets the Admin switch
     between viewing Archived Modules and Archived Categories with full
     Search, Restore, and Permanent Delete capabilities. -->
<div id="archivedModulesModal" class="custom-modal-overlay is-hidden">
    <div class="custom-modal-dialog">
        <div class="custom-modal-header">
            <h3>Archived Items</h3>
            <button type="button" class="categories-close-btn" id="closeArchivedModulesModal">&times;</button>
        </div>

        <div class="custom-modal-body">
            <!-- Toggle Switcher: Modules vs Categories -->
            <div class="archive-toggle-group">
                <button type="button" class="archive-toggle-btn active" id="toggleArchivedModulesBtn" data-tab="modules">
                    <i class="fa-solid fa-layer-group"></i> Archived Modules
                </button>
                <button type="button" class="archive-toggle-btn" id="toggleArchivedCategoriesBtn" data-tab="categories">
                    <i class="fa-solid fa-folder"></i> Archived Categories
                </button>
            </div>

            <!-- Unified Search Bar -->
            <div class="header-search search-override">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="archivedSearchInput" placeholder="Search archived modules...">
            </div>

            <!-- Tab 1: Archived Modules View -->
            <div id="archivedModulesView">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Module</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Updated</th>
                            <th class="text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="archivedModulesTableBody">
                        <tr>
                            <td colspan="5" class="text-muted table-empty-message">Loading archived modules&hellip;</td>
                        </tr>
                    </tbody>
                </table>

                <div class="table-pagination" id="archivedModulesPagination">
                    <span id="archivedModulesShowingCount">Showing 0 of 0 Archived Modules</span>
                    <span>
                        <button id="archivedModulesPrevBtn" class="icon-button-reset" disabled>&lt;</button>
                        <span id="archivedModulesPageLabel">1 of 1</span>
                        <button id="archivedModulesNextBtn" class="icon-button-reset" disabled>&gt;</button>
                    </span>
                </div>
            </div>

            <!-- Tab 2: Archived Categories View -->
            <div id="archivedCategoriesView" class="is-hidden">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>Modules Count</th>
                            <th class="text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="archivedCategoriesTableBody">
                        <tr>
                            <td colspan="3" class="text-muted table-empty-message">Loading archived categories&hellip;</td>
                        </tr>
                    </tbody>
                </table>

                <div class="table-pagination" id="archivedCategoriesPagination">
                    <span id="archivedCategoriesShowingCount">Showing 0 of 0 Archived Categories</span>
                    <span>
                        <button id="archivedCategoriesPrevBtn" class="icon-button-reset" disabled>&lt;</button>
                        <span id="archivedCategoriesPageLabel">1 of 1</span>
                        <button id="archivedCategoriesNextBtn" class="icon-button-reset" disabled>&gt;</button>
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>
