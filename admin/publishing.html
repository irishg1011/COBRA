<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CobraByte Admin - Publishing</title>
    <link rel="stylesheet" href="{{ url_for('admin_bp.static', filename='css/admin-style.css') }}">
    <link rel="stylesheet" href="{{ url_for('admin_bp.static', filename='css/publishing.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="admin-layout">
        {% include 'admin-sidebar.html' %}

        <main class="admin-main-content">
            {% include 'admin-header.html' %}

            <div class="dashboard-content-area">

                <div class="dashboard-top-bar">
                    <div class="welcome-section">
                        <h1>Publishing</h1>
                        <p>Review content in the order learners see it, then publish it live.</p>
                    </div>
                </div>

                <div class="publishing-tabs-row">
                    <button type="button" id="pubTabReady" class="publishing-tab active" data-tab="ready">
                        Ready to Publish <span class="badge badge-draft" id="pubReadyCount">0</span>
                    </button>
                    <button type="button" id="pubTabPublished" class="publishing-tab" data-tab="published">
                        Published <span class="badge badge-active" id="pubPublishedCount">0</span>
                    </button>
                </div>

                <div class="publishing-card">
                    <div id="publishingTreeRoot" data-tree='{{ tree_json | safe }}'>
                        <p class="text-muted publishing-empty">Loading&hellip;</p>
                    </div>
                </div>

                <p class="text-muted" style="margin-top:12px; font-size:13px;">Click a name to see Edit / Preview. Click the arrow to expand or collapse.</p>

            </div>
        </main>
    </div>

    {% include 'confirm-action-modal.html' %}

    <script src="{{ url_for('admin_bp.static', filename='js/admin-auth-guard.js') }}"></script>
    <script src="{{ url_for('admin_bp.static', filename='js/admin-publishing.js') }}"></script>
</body>
</html>
