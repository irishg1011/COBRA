<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CobraByte - Set a New Password</title>
    <link rel="stylesheet" href="{{ url_for('admin_bp.static', filename='css/admin-style.css') }}">
    <link rel="stylesheet" href="{{ url_for('admin_bp.static', filename='css/staff-change-password.css') }}">
    <link rel="stylesheet" href="{{ url_for('admin_bp.static', filename='css/account-tools.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
</head>
<body class="set-pw-body">
    <!-- admin/staff-set-password.html (feat/account-tools) - the forced
         "Set a new password" screen. An admin gave this account a temporary
         password (Help Requests > Reset password); until a new one is saved,
         every other staff page sends the person here. No sidebar on purpose.
         Script: js/admin-set-password.js -> POST /staff/set-password. -->
    <div class="set-pw-topbar">
        <img src="/assets/images/logo-ad.png" alt="CobraByte" class="set-pw-logo">
        <a href="{{ url_for('admin_bp.admin_logout') }}" class="set-pw-logout"><i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i> Log out</a>
    </div>

    <div class="staff-pw-page">
        <section class="staff-pw-card" aria-labelledby="setPwTitle">
            <h1 class="staff-pw-title" id="setPwTitle">Set a new password</h1>
            <p class="staff-pw-subtitle">You signed in with a temporary password from an administrator. Choose your own password to continue.</p>

            <div class="staff-pw-panel" data-step="form">
                <div class="staff-pw-field">
                    <label for="setPwNew">New password</label>
                    <div class="staff-pw-input-wrap">
                        <input type="password" id="setPwNew" autocomplete="new-password" autofocus>
                        <button type="button" class="staff-pw-toggle" data-toggle="setPwNew" aria-label="Show password"><i class="fa-regular fa-eye" aria-hidden="true"></i></button>
                    </div>
                </div>
                <ul class="staff-pw-rules" id="setPwRules">
                    <li data-rule="length">At least 8 characters</li>
                    <li data-rule="upper">An uppercase letter</li>
                    <li data-rule="lower">A lowercase letter</li>
                    <li data-rule="number">A number</li>
                    <li data-rule="special">A special character</li>
                </ul>
                <div class="staff-pw-field">
                    <label for="setPwConfirm">Confirm new password</label>
                    <div class="staff-pw-input-wrap">
                        <input type="password" id="setPwConfirm" autocomplete="new-password">
                        <button type="button" class="staff-pw-toggle" data-toggle="setPwConfirm" aria-label="Show password"><i class="fa-regular fa-eye" aria-hidden="true"></i></button>
                    </div>
                </div>
                <div class="staff-pw-actions">
                    <button type="button" class="staff-pw-btn" id="setPwSaveBtn">Save and continue</button>
                </div>
            </div>

            <p class="staff-pw-message" id="setPwMessage" role="status"></p>
        </section>
    </div>

    <script src="{{ url_for('admin_bp.static', filename='js/admin-set-password.js') }}"></script>
</body>
</html>
