<!-- admin/admin-create-admin-modal.html -->
<div id="createAdminModal" class="modal-overlay modal-hidden">
    <div class="modal-card create-admin-card wide-modal-card">
        <button type="button" class="modal-close-btn" id="closeCreateAdminModal">&times;</button>
        
        <div class="modal-header-section">
            <div class="modal-icon-glow">
                <i class="fa-solid fa-user-gear"></i>
            </div>
            <h2>Create New Administrator</h2>
            <p>Fill in the details to register a new account.</p>
        </div>

        <form id="createAdminForm" action="{{ url_for('admin_bp.create_administrator') }}" method="POST">
            
            <div class="modal-form-grid">
                <!-- Left Column: Account ID & Login Credentials -->
                <div class="modal-form-column">
                    <!-- Account ID Section -->
                    <div class="form-section-group">
                        <span class="form-section-label">Account ID (Auto-Generated)</span>
                        <div class="form-group">
                            <label for="admin_acc_id">Account ID</label>
                            <!-- Preview only - the backend always generates the
                                 real, authoritative ID server-side (see
                                 admin_routes.py: create_administrator());
                                 whatever is typed/left here is never read. -->
                            <input type="text" id="admin_acc_id" name="acc_id" value="Auto-generated on submit" readonly class="input-readonly">
                        </div>
                    </div>

                    <!-- Login Credentials Section -->
                    <div class="form-section-group">
                        <span class="form-section-label">Login Credentials</span>
                        <div class="form-group">
                            <label for="admin_username">Username</label>
                            <input type="text" id="admin_username" name="username" placeholder="e.g. goldy123" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="admin_password">Password</label>
                                <div class="password-wrapper">
                                    <input type="password" id="admin_password" name="password" placeholder="Min. 8 characters" required>
                                    <div class="toggle-password-visibility">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="eye-icon">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                                        </svg>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="admin_confirm_password">Confirm Password</label>
                                <div class="password-wrapper">
                                    <input type="password" id="admin_confirm_password" name="confirm_password" placeholder="Re-enter password" required>
                                    <div class="toggle-password-visibility">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="eye-icon">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                                        </svg>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Personal Information -->
                <div class="modal-form-column">
                    <div class="form-section-group">
                        <span class="form-section-label">Personal Information</span>
                        <div class="form-group">
                            <label for="admin_email">Email Address</label>
                            <input type="email" id="admin_email" name="email" placeholder="e.g. goldespañola@gmail.com" required>
                        </div>
                        <div class="form-group">
                            <label for="admin_mobile">Mobile Number</label>
                            <input type="text" id="admin_mobile" name="mobile" placeholder="09XXXXXXXXX" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="admin_firstname">First Name</label>
                                <input type="text" id="admin_firstname" name="first_name" placeholder="Gold" required>
                            </div>
                            <div class="form-group">
                                <label for="admin_lastname">Last Name</label>
                                <input type="text" id="admin_lastname" name="last_name" placeholder="Española" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="admin_gender">Gender</label>
                                <!-- Task: Gender dropdown populated dynamically from
                                     gender_tbl (see admin_routes.py:
                                     get_gender_options(), injected into every admin
                                     template via inject_current_admin()) - never
                                     hardcoded. -->
                                <select id="admin_gender" name="gender" class="custom-select" required>
                                    <option value="" disabled selected>Enter gender</option>
                                    {% for g in genders %}
                                    <option value="{{ g.gender }}">{{ g.gender }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="admin_birthdate">Birthdate</label>
                                <!--
                                    NEW: Admin accounts require an age between
                                    ADMIN_MIN_SIGNUP_AGE (20) and
                                    ADMIN_MAX_SIGNUP_AGE (60) - different from
                                    Learner Sign Up's 13-60. min/max attributes
                                    are also set live by
                                    admin-create-admin.js's
                                    setAdminBirthdateBounds() on load, and the
                                    exact age is re-validated both client-side
                                    (checkAdminBirthdateAge()) and server-side
                                    (admin_routes.py -> validators.validate_birthdate()).
                                -->
                                <input type="date" id="admin_birthdate" name="birthdate" required>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer Action -->
            <div class="modal-footer-actions">
                <button type="submit" class="btn btn-create-account">
                    <i class="fa-solid fa-user-plus"></i> Create Account
                </button>
            </div>

        </form>
    </div>
</div>
