<!-- admin/admin-create-account-modal.html
     feat/mentor-role: the ONE Create staff account modal, shared by
     admin-create-admin-modal.html and admin-create-mentor-modal.html.
     Those set these (in a Jinja "with" block) before including it:
         account_type  "admin" | "mentor"  (data-account-type, read by admin-create-admin.js)
         p             element id prefix   ("admin" | "mentor")
         account_label "Administrator" | "Mentor" (used in messages)
         modal_id, form_id, close_id, heading, form_action
     Same fields and validation for both account types. -->
<div id="{{ modal_id }}" class="modal-overlay modal-hidden js-create-account-modal" data-account-type="{{ account_type }}" data-account-label="{{ account_label }}" data-id-prefix="{{ p }}">
    <div class="modal-card create-admin-card wide-modal-card">
        <button type="button" class="modal-close-btn" id="{{ close_id }}">&times;</button>
        
        <div class="modal-header-section">
            <div class="modal-icon-glow">
                <i class="fa-solid fa-user-gear"></i>
            </div>
            <h2>{{ heading }}</h2>
            <p>Fill in the details to register a new account.</p>
        </div>

        <form id="{{ form_id }}" class="js-create-account-form" action="{{ form_action }}" method="POST">
            
            <div class="modal-form-grid">
                <!-- Left Column: Account ID & Login Credentials -->
                <div class="modal-form-column">
                    <!-- Account ID Section -->
                    <div class="form-section-group">
                        <span class="form-section-label">Account ID (Auto-Generated)</span>
                        <div class="form-group">
                            <label for="{{ p }}_acc_id">Account ID</label>
                            <!-- Preview only - the backend always generates the
                                 real, authoritative ID server-side (see
                                 admin_routes.py: _create_staff_account());
                                 whatever is typed/left here is never read. -->
                            <input type="text" id="{{ p }}_acc_id" name="acc_id" value="Auto-generated on submit" readonly class="input-readonly">
                        </div>
                    </div>

                    <!-- Login Credentials Section -->
                    <div class="form-section-group">
                        <span class="form-section-label">Login Credentials</span>
                        <div class="form-group">
                            <label for="{{ p }}_username">Username</label>
                            <input type="text" id="{{ p }}_username" name="username" placeholder="e.g. goldy123" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="{{ p }}_password">Password</label>
                                <div class="password-wrapper">
                                    <input type="password" id="{{ p }}_password" name="password" placeholder="Min. 8 characters" required>
                                    <div class="toggle-password-visibility">
                                        <i class="fa-regular fa-eye eye-icon eye-icon--font" aria-hidden="true"></i>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="{{ p }}_confirm_password">Confirm Password</label>
                                <div class="password-wrapper">
                                    <input type="password" id="{{ p }}_confirm_password" name="confirm_password" placeholder="Re-enter password" required>
                                    <div class="toggle-password-visibility">
                                        <i class="fa-regular fa-eye eye-icon eye-icon--font" aria-hidden="true"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Personal Information -->
                <div class="modal-form-column">
                    <div class="form-section-group">
                        <span class="form-section-label">Personal Information</span>
                        <div class="form-group">
                            <label for="{{ p }}_email">Email Address</label>
                            <input type="email" id="{{ p }}_email" name="email" placeholder="e.g. goldespañola@gmail.com" required>
                        </div>
                        <div class="form-group">
                            <label for="{{ p }}_mobile">Mobile Number</label>
                            <input type="text" id="{{ p }}_mobile" name="mobile" placeholder="09XXXXXXXXX" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="{{ p }}_firstname">First Name</label>
                                <input type="text" id="{{ p }}_firstname" name="first_name" placeholder="Gold" required>
                            </div>
                            <div class="form-group">
                                <label for="{{ p }}_lastname">Last Name</label>
                                <input type="text" id="{{ p }}_lastname" name="last_name" placeholder="Española" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="{{ p }}_gender">Gender</label>
                                <!-- Task: Gender dropdown populated dynamically from
                                     gender_tbl (see admin_routes.py:
                                     get_gender_options(), injected into every admin
                                     template via inject_current_admin()) - never
                                     hardcoded. -->
                                <select id="{{ p }}_gender" name="gender" class="custom-select" required>
                                    <option value="" disabled selected>Enter gender</option>
                                    {% for g in genders %}
                                    <option value="{{ g.gender }}">{{ g.gender }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="{{ p }}_birthdate">Birthdate</label>
                                <!--
                                    NEW: Admin (and Mentor) accounts require an age between
                                    ADMIN_MIN_SIGNUP_AGE (20) and
                                    ADMIN_MAX_SIGNUP_AGE (60) - different from
                                    Learner Sign Up's 13-60. min/max attributes
                                    are also set live by
                                    admin-create-admin.js's
                                    setAdminBirthdateBounds() on load, and the
                                    exact age is re-validated both client-side
                                    (checkAdminBirthdateAge()) and server-side
                                    (admin_routes.py -> validators.validate_birthdate()).
                                -->
                                <input type="date" id="{{ p }}_birthdate" name="birthdate" required>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Footer Action -->
            <div class="modal-footer-actions">
                <button type="submit" class="btn btn-create-account">
                    <i class="fa-solid fa-user-plus"></i> Create Account
                </button>
            </div>

        </form>
    </div>
</div>
