<!-- learner-progress-lesson-modal.html - Learner Progress: ONE lesson.
     Opened by the By Lesson eye button and by lesson rows in the card
     modals (admin-lesson-learners-modal.js - window.CobraLessonModal).
     feat/learner-progress-insights: summary, step funnel, results per
     activity type, the TOP 5 most-missed questions ("Edit question" for
     mentors only) and every learner with a status chip. Each learner's
     eye opens the shared Lesson Progress modal on top.
     Hidden by default with .modal-hidden. -->
<div id="lessonLearnersModal" class="modal-overlay modal-hidden" role="dialog" aria-modal="true" aria-labelledby="lessonLearnersTitle"
     data-can-edit="{{ 1 if current_role == 'Mentor' else 0 }}">
    <div class="progress-detail-card lesson-learners-card">

        <div class="progress-detail-header">
            <div>
                <h3 id="lessonLearnersTitle">—</h3>
                <p class="progress-detail-subtitle" id="lessonLearnersPath">—</p>
            </div>
            <button type="button" class="modal-close-btn modal-close-inline" id="closeLessonLearnersBtn" title="Close" aria-label="Close">&times;</button>
        </div>

        <p id="lessonLearnersError" class="progress-detail-error"></p>

        <div class="progress-detail-body">
            <p class="lesson-learners-note" id="lessonLearnersNote"></p>

            <div class="progress-summary-grid" id="lessonInsightSummary"></div>

            <section class="progress-detail-section">
                <h4><i class="fa-solid fa-filter"></i> Steps <span class="lp-info" tabindex="0" role="note" data-tip="How many learners got past each step of this lesson, in order: video, content, activities, exercise, finished.">i</span></h4>
                <div id="lessonInsightFunnel" class="lp-funnel"></div>
            </section>

            <section class="progress-detail-section">
                <h4><i class="fa-solid fa-puzzle-piece"></i> By activity type <span class="lp-info" tabindex="0" role="note" data-tip="First-try average of the learners who finished each activity (retakes don't raise it). Timeouts and skips count questions on the first try. Retakes = retake rounds started (for the exercise: extra attempts).">i</span></h4>
                <div id="lessonInsightTypes"></div>
            </section>

            <section class="progress-detail-section">
                <h4><i class="fa-solid fa-circle-question"></i> Most-missed questions <span class="lp-info" tabindex="0" role="note" data-tip="The 5 questions learners got wrong most often on their FIRST try. 'Check the answer key' shows when almost everyone misses one - the answer itself may be wrong.">i</span></h4>
                <div id="lessonInsightMissed"></div>
            </section>

            <section class="progress-detail-section">
                <h4><i class="fa-solid fa-users"></i> Learners</h4>
                <div class="table-scroll">
                    <table class="data-table progress-table">
                        <thead>
                            <tr>
                                <th>Learner</th>
                                <th>Score <span class="lp-info" tabindex="0" role="note" data-tip="Finished: the lesson score (first try). Not finished yet: first-try score of the activities done so far.">i</span></th>
                                <th>Status</th>
                                <th>Completion</th>
                                <th>Stuck at</th>
                                <th>Started</th>
                                <th>Last update</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="lessonLearnersTableBody">
                            <tr><td colspan="8" class="text-muted table-empty-message">Loading&hellip;</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>
</div>
